name: Build and verify CloudLauncher APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/CloudLauncher-v1.3.0-debug.apk

      - name: Verify cold start on Android 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.kikyo.cloudlauncher
            adb shell am start -W -n com.kikyo.cloudlauncher/.MainActivity
            sleep 8
            test -n "$(adb shell pidof com.kikyo.cloudlauncher | tr -d '\r')"
            if adb logcat -d -v brief | grep -Eq 'FATAL EXCEPTION|Process: com\\.kikyo\\.cloudlauncher'; then
              adb logcat -d -v brief
              exit 1
            fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudLauncher-v1.3.0-debug
          path: app/build/outputs/apk/debug/CloudLauncher-v1.3.0-debug.apk
          if-no-files-found: error
