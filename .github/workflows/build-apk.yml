name: Build and verify CloudLauncher APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer fix supersedes any stale emulator boot immediately.
concurrency:
  group: cloudlauncher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      # Upload first. An emulator download can never hold delivery hostage.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudLauncher-v1.3.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  verify-cold-start:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Download compiled APK
        uses: actions/download-artifact@v4
        with:
          name: CloudLauncher-v1.3.1-debug
          path: artifact

      - name: Verify cold start on Android 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r artifact/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.kikyo.cloudlauncher
            adb shell am start -W -n com.kikyo.cloudlauncher/.MainActivity
            sleep 8
            test -n "$(adb shell pidof com.kikyo.cloudlauncher | tr -d '\r')"
            if adb logcat -d -v brief | grep -Eq 'FATAL EXCEPTION|Process: com\.kikyo\.cloudlauncher'; then
              adb logcat -d -v brief
              exit 1
            fi
