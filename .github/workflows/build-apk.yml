name: Build CloudLauncher APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/CloudLauncher-v1.2.9-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudLauncher-v1.2.9-debug
          path: app/build/outputs/apk/debug/CloudLauncher-v1.2.9-debug.apk
          if-no-files-found: error
