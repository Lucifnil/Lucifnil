name: Build and verify CloudLauncher APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer fix supersedes any stale emulator boot immediately.
concurrency:
  group: cloudlauncher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      # Upload first. An emulator download can never hold delivery hostage.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudLauncher-v1.3.3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  verify-cold-start:
    needs: build
    # The ARM macOS host cannot expose Hypervisor.framework to the nested
    # Android emulator (HV_UNSUPPORTED), so it exits before the APK is ever
    # installed. Use the official Linux/KVM configuration instead.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download compiled APK
        uses: actions/download-artifact@v4
        with:
          name: CloudLauncher-v1.3.3-debug
          path: artifact

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify cold start on Android 33 x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect
          script: |
            adb kill-server || true
            adb start-server
            adb wait-for-device
            adb devices -l
            adb install -r artifact/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.kikyo.cloudlauncher
            adb shell am start -W -n com.kikyo.cloudlauncher/.MainActivity
            sleep 8
            test -n "$(adb shell pidof com.kikyo.cloudlauncher | tr -d '\r')"
            if adb logcat -d -v brief | grep -Eq 'FATAL EXCEPTION|Process: com\.kikyo\.cloudlauncher'; then
              adb logcat -d -v brief
              exit 1
            fi
