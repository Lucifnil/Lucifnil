name: Build and verify CloudLauncher APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer fix supersedes any stale emulator boot immediately.
concurrency:
  group: cloudlauncher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      # Upload first. An emulator download can never hold delivery hostage.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudLauncher-v1.3.3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  verify-cold-start:
    needs: build
    # The ARM macOS host cannot expose Hypervisor.framework to the nested
    # Android emulator (HV_UNSUPPORTED), so it exits before the APK is ever
    # installed.  Use the official Linux/KVM configuration instead.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download compiled APK
        uses: actions/download-artifact@v4
        with:
          name: CloudLauncher-v1.3.3-debug
          path: artifact

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify cold start on Android 33 x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect
          script: |
            # The previous run never installed the APK: its inherited ADB
            # daemon died with Broken pipe.  Start a fresh server before
            # treating this as a cold-start result.
            adb kill-server || true
            adb start-server
            adb wait-for-device
            adb devices -l
            adb install -r artifact/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.kikyo.cloudlauncher
            # android-emulator-runner executes script lines independently.
            # Keep every command self-contained so a failure still leaves the
            # startup result and the relevant AndroidRuntime trace in the log.
            timeout 25 adb shell am start -W -n com.kikyo.cloudlauncher/.MainActivity > activity-start.txt 2>&1 || true
            cat activity-start.txt
            sleep 8
            adb logcat -d -v threadtime > cold-start-full.log || true
            adb logcat -d -v threadtime | grep -E -A 100 -B 15 'FATAL EXCEPTION|Fatal signal|Process: com\.kikyo\.cloudlauncher|ANR in com\.kikyo\.cloudlauncher|tombstoned' > cold-start.log || true
            cat cold-start.log
            test ! -s cold-start.log
            test -n "$(adb shell pidof com.kikyo.cloudlauncher | tr -d '\r')"
            test -z "$(grep 'Status: timeout' activity-start.txt)"

      - name: Upload cold-start diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CloudLauncher-cold-start-diagnostics
          path: |
            activity-start.txt
            cold-start.log
            cold-start-full.log
          if-no-files-found: warn
